<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      [data-page] {
        display: none;
      }
      [data-page].active {
        display: block;
      }

      .fade-item {
        opacity: 0;
        transform: translateY(24px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }
      .fade-item.visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body class="bg-white text-gray-900 font-sans min-h-screen">
    <script src="data.js"></script>

    <header class="fixed top-0 left-0 w-full z-50 bg-white shadow-md">
      <div
        class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"
      >
        <nav
          class="hidden sm:flex space-x-4 text-sm font-medium"
          id="desktop-nav"
        ></nav>
        <button class="sm:hidden p-2" id="hamburger-btn">
          <svg
            id="icon-menu"
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <svg
            id="icon-close"
            class="w-5 h-5 hidden"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
      <div
        id="mobile-nav"
        class="hidden sm:hidden bg-white border-t border-gray-100 px-6 py-3 flex flex-col space-y-3"
      ></div>
    </header>

    <div id="page-main" data-page class="active pt-16">
      <div class="max-w-6xl mx-auto px-6">
        <div class="pt-6 text-xs text-gray-400" id="clock"></div>

        <section
          id="home"
          class="min-h-[80vh] flex flex-col justify-center items-center pt-20 pb-8"
        >
          <div class="text-center fade-item">
            <h1
              class="text-3xl md:text-4xl font-extrabold tracking-tight leading-snug text-gray-900"
            >
              PORTFOLIO
            </h1>
            <p class="mt-4 text-base max-w-2xl text-gray-700" id="school"></p>
            <p class="mt-3 text-xl font-semibold text-gray-800" id="name"></p>
          </div>
        </section>

        <section id="skills" class="pt-24 pb-12 min-h-[40vh]">
          <h2
            class="text-2xl font-bold border-b-2 border-cyan-600 pb-2 mb-8 text-gray-900 fade-item"
          >
            TECHNOLOGY
          </h2>
          <div
            class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"
            id="tech-list"
          ></div>
        </section>

        <section id="projects" class="pt-24 pb-12 min-h-[40vh]">
          <h2
            class="text-2xl font-bold border-b-2 border-cyan-600 pb-2 mb-8 text-gray-900 fade-item"
          >
            PROJECTS
          </h2>
          <div
            class="grid grid-cols-1 md:grid-cols-2 gap-8"
            id="project-list"
          ></div>
        </section>

        <section id="contact" class="pt-24 pb-12 min-h-[40vh]">
          <h2
            class="text-2xl font-bold border-b-2 border-cyan-600 pb-2 mb-8 text-gray-900 fade-item"
          >
            CONTACT
          </h2>
          <div
            class="text-gray-500 text-sm flex items-center space-x-4 fade-item"
          >
            <a
              id="github-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="hover:underline flex items-center space-x-1"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                />
              </svg>
              <span>GitHub</span>
            </a>
            <a
              id="blog-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="hover:underline flex items-center space-x-1"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                />
              </svg>
              <span id="blog-label"></span>
            </a>
          </div>
          <div class="mt-3 text-gray-500 text-sm flex items-center fade-item">
            <svg
              class="w-4 h-4 mr-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              />
            </svg>
            <span id="email"></span>
          </div>
        </section>

        <footer
          class="py-6 text-center text-xs text-gray-500 border-t border-gray-200 mt-16"
        >
          © 2025 Portfolio. Built with HTML, CSS & JavaScript.
        </footer>
      </div>
    </div>

    <div id="page-detail" data-page class="pt-16">
      <div class="max-w-4xl mx-auto px-6 pt-28 pb-16">
        <button
          id="back-btn"
          class="flex items-center text-sm text-gray-500 hover:text-cyan-600 transition-colors mb-8"
        >
          <svg
            class="w-4 h-4 mr-1"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            />
          </svg>
          목록으로 돌아가기
        </button>

        <h1
          id="detail-title"
          class="text-3xl font-extrabold text-gray-900 mb-2"
        ></h1>
        <div class="h-1 w-16 bg-cyan-600 rounded mb-8"></div>

        <div id="detail-video-wrap" class="mb-10 hidden">
          <h2 class="text-lg font-semibold text-gray-800 mb-3">참고 영상</h2>
          <div
            class="w-full rounded-xl overflow-hidden shadow-md"
            style="aspect-ratio: 16/9"
          >
            <iframe
              id="detail-video-iframe"
              class="w-full h-full hidden"
              allowfullscreen
            ></iframe>
            <video
              id="detail-video-file"
              class="w-full h-full hidden"
              controls
            ></video>
          </div>
        </div>

        <div class="mb-10">
          <div
            id="detail-images"
            class="grid grid-cols-1 sm:grid-cols-2 gap-4"
          ></div>
          <div
            id="detail-no-image"
            class="w-full bg-gray-100 rounded-lg flex flex-col items-center justify-center border-2 border-dashed border-gray-300 py-20 hidden"
          >
            <svg
              class="w-8 h-8 text-gray-400 mb-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
            <span class="text-xs text-gray-400"
              >images 배열에 경로를 넣으면 여기에 표시됩니다</span
            >
          </div>
        </div>

        <div class="mb-10">
          <h2 class="text-lg font-semibold text-gray-800 mb-3">
            프로젝트 설명
          </h2>
          <p
            id="detail-desc"
            class="text-gray-600 text-sm leading-relaxed whitespace-pre-line"
          ></p>
        </div>

        <div id="detail-link-wrap">
          <a
            id="detail-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center px-5 py-3 bg-cyan-600 text-white font-semibold rounded-lg shadow hover:bg-cyan-700 transition duration-150"
          >
            <svg
              class="w-4 h-4 mr-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M14.828 14.828a4 4 0 015.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"
              />
            </svg>
            프로젝트 링크 →
          </a>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
